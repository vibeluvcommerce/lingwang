# ==========================================================================
#  zhangxinshi.com —— 由 install.sh 渲染后安装
#  占位符：__DOMAIN__ / __SITE_DIR__ / __CERT_CRT__ / __CERT_KEY__
#
#  证书是阿里云签发的 nginx 格式（pem 为完整链：站点证书 + 中间证书）。
#  证书 90 天有效，到期前把新文件覆盖到同一路径，再 reload 即可。
# ==========================================================================

# ---------------------------------------------------------------- 80 跳 443
server {
    listen      80;
    listen      [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # 证书续期/HTTP 校验留个口子，其余全部跳 https
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

# ---------------------------------------------------------------- www 归一到 apex
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     __CERT_CRT__;
    ssl_certificate_key __CERT_KEY__;

    return 301 https://__DOMAIN__$request_uri;
}

# ---------------------------------------------------------------- 主站
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name __DOMAIN__;

    # 站点根 = git 工作区，deploy.sh 就地更新，无需 reload
    root  __SITE_DIR__;
    index index.html;

    charset       utf-8;
    server_tokens off;

    ssl_certificate     __CERT_CRT__;
    ssl_certificate_key __CERT_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log warn;

    # 证书 90 天、手动续，先不开 HSTS；续期稳定后可加：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------------------------------------------------------- 压缩
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ---------------------------------------------------------- 安全响应头
    # server 级统一加；location 里不再写 add_header，否则会被整组覆盖
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # ---------------------------------------------------------- 仓库文件不可读
    # 站点根就是仓库：.git 泄露等于源码+远端配置全公开；
    # README/DEPLOY/deploy.sh/nginx 模板也不是给访客看的。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(md|sh|conf|gitignore|gitattributes|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------------------------------------------------------- 静态资源缓存
    # 文件名不带内容指纹：CSS/JS 只给 1 小时，改完刷新就能看到
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|ico|svg|woff2?|ttf|otf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|mjs)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------- 页面
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
